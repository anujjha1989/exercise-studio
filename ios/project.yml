name: ExerciseStudio
options:
  bundleIdPrefix: com.anujjha
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4YQ5449J68
targets:
  ExerciseStudio:
    type: application
    platform: iOS
    sources: [ExerciseStudio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anujjha.exercise-studio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Exercise Studio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select progress photos for your workout log.
        INFOPLIST_KEY_NSCameraUsageDescription: Take progress photos for your workout log.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  ExerciseStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ExerciseStudioTests]
    dependencies:
      - target: ExerciseStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ExerciseStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ExerciseStudioUITests]
    dependencies:
      - target: ExerciseStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ExerciseStudio:
    build:
      targets:
        ExerciseStudio: all
        ExerciseStudioTests: [test]
        ExerciseStudioUITests: [test]
    test:
      targets: [ExerciseStudioTests, ExerciseStudioUITests]
