<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exercise Studio</title>
<meta name="theme-color" content="#0F1B3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Exercise Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Azeret+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="wide">Exercise Studio</span></div>
  <nav id="tabs" aria-label="Sections">
    <button data-act="tab" data-tab="today">Today</button>
    <button data-act="tab" data-tab="library">Library</button>
    <button data-act="tab" data-tab="history">History</button>
    <button data-act="tab" data-tab="progress">Progress</button>
    <button data-act="tab" data-tab="setup">Setup</button>
  </nav>
  <span id="sync" class="sync"><i></i><span>Connecting</span></span>
</header>
<main id="main"></main>
<div id="restpill" class="restpill" hidden><span class="lab">Rest</span><span class="mono" id="restpill-t"></span><button data-act="rest-add">+15s</button><button data-act="rest-skip">Skip</button></div>
<dialog id="sheet" aria-label="Exercise"></dialog>
<div id="player" class="player" hidden></div>
<script src="data.js"></script>
<script src="figure.js"></script>
<script src="app.js"></script>
</body>
</html>
