name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm run stage-assets
      - run: git diff --exit-code -- public/vendor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      # PNG compression bytes vary by platform; verify exact decoded pixels and dimensions.
      - run: python scripts/stage-icons.py --check
      - run: npm run check
      - run: npm test
      - run: bash -n update.sh
