name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm run stage-assets
      - run: git diff --exit-code -- public/vendor
      - run: npm run check
      - run: npm test
      - run: bash -n update.sh
